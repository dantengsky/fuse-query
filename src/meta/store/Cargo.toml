[package]
name = "databend-common-meta-store"
description = "MetaStore is impl with either a local embedded meta store, or a grpc-client of metasrv"
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
edition = { workspace = true }

[lib]
doctest = false
test = true

[features]
io-uring = ["databend-common-meta-embedded/io-uring"]

[dependencies]
async-trait = { workspace = true }
databend-common-grpc = { workspace = true }
databend-common-meta-client = { workspace = true }
databend-common-meta-embedded = { workspace = true }
databend-common-meta-kvapi = { workspace = true }
databend-common-meta-types = { workspace = true }
log = { workspace = true }
tokio-stream = { workspace = true }
tokio = { version = "1.39.2", features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
