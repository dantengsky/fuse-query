name: "04_stale_range_broadcast"
description: "A selective stale range may broadcast while retaining source-risk protection"

sql: |
  SELECT d.join_key
  FROM (
      SELECT join_key
      FROM stale_range_source
      WHERE range_value > 10 AND selective_value = 42
  ) AS s
  INNER JOIN large_dimension AS d
  ON s.join_key = d.join_key;

node_num: 3

table_statistics:
  stale_range_source:
    num_rows: 200000000000
  large_dimension:
    num_rows: 225000000

column_statistics:
  stale_range_source.join_key:
    min: 1
    max: 200000000000
    ndv: 200000000000
    null_count: 0
  stale_range_source.range_value:
    min: 0
    max: 5
    ndv: 6
    null_count: 0
  stale_range_source.selective_value:
    min: 0
    max: 99
    ndv: 100
    null_count: 0
  large_dimension.join_key:
    min: 1
    max: 225000000
    ndv: 225000000
    null_count: 0

tables:
  stale_range_source: basic/04_stale_range_source.sql
  large_dimension: basic/04_large_dimension.sql
