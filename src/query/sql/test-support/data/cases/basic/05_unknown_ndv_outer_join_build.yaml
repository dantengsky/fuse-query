name: "05_unknown_ndv_outer_join_build"
description: "A huge scan with unknown-NDV integer equality filters must not become the outer-join build side instead of a small time-window input"

sql: |
  SELECT a.id, a.member_id, a.network, a.coin, a.amount, a.note,
         b.txn_ref, c.member_id, c.network, c.coin, c.moved_amount
  FROM activity_source AS a
  LEFT JOIN (
      SELECT req_ref, member_id, txn_ref
      FROM pending_lookup
      WHERE updated_at > TIMESTAMP '2026-09-18 07:00:00'
        AND substr(req_ref, 1, 1) = 'd'
  ) AS b
  ON a.note = b.req_ref AND a.member_id = b.member_id
  LEFT JOIN (
      SELECT txn_ref, member_id, network, coin, moved_amount
      FROM settlement_source
      WHERE state = 7 AND return_state = 5
  ) AS c
  ON b.txn_ref = c.txn_ref AND b.member_id = c.member_id
  WHERE a.kind = 3
    AND a.state = 6
    AND a.apply_at >= TIMESTAMP '2026-09-18 08:00:00'
    AND a.apply_at <= TIMESTAMP '2026-09-18 10:00:00'
    AND a.auto_state = '2'
    AND substr(a.note, 1, 1) = 'd'
    AND abs(a.amount - ifnull(c.moved_amount, 0)) > 0.00000001
  LIMIT 100;

node_num: 3

